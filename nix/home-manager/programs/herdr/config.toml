# herdr configuration (nix 管理。 実体は ~/.config/herdr/config.toml)
#
# 既定値を全部書くと herdr の更新に追従できなくなるので、 既定から変えたいものだけ書く。
# 全既定値は `herdr --default-config` で出る。 変更後は `herdr server reload-config`
# (または prefix+shift+r) で走行中のサーバーに反映できる。

[theme]
# wezterm 側で Everforest Dark (Gogh) を使っており、 herdr には everforest の
# built-in が無い。 "terminal" はホストターミナルの ANSI パレットに従うので、
# これで wezterm の配色にそのまま乗る。
name = "terminal"

[terminal]
# 新規ペインは login shell で起動する (macOS の既定)。 これのおかげでペイン内から
# mise / Homebrew / nix の PATH がそのまま引ける = dev-up が起こすコマンドも
# "command not found" にならない。 明示しておく。
shell_mode = "auto"
# 新規タブ/ペインの cwd は呼び出し元を引き継ぐ (--cwd 明示時はそちらが優先)。
new_cwd = "follow"

[ui]
# タブが1つだけのワークスペースでもタブ行を残す (dev:<name> タブが生えたときに
# 行が急に出てレイアウトがずれるのを避ける)。
hide_tab_bar_when_single_tab = false
# 新規タブ作成時に名前を聞かない。 タブ名は tab-name skill / スクリプトが付ける。
prompt_new_tab_name = false

# サイドバーのエージェント行。 claude だけ端末タイトル (= 作業中のリポジトリ等) も出す。
# 旧 zellij 構成の「🤖 / ✅ をタブ名に付ける hook」の置き換えがこれ。 状態は
# herdr が integration 経由で受け取るので、 自前 hook は不要。
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[session]
# サーバー再起動後、 claude ペインを元の会話セッションに復帰させる。
resume_agents_on_restore = true
